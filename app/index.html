<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>의결권 위임 플랫폼 · 현장 파트너</title>
<link rel="icon" href="../kudos-favicon.png">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css?v=75">
</head>
<body>
<div id="phone">

  <!-- ══ 로그인 ══ -->
  <section class="scr on" id="scrLogin">
    <div class="lg">
      <div class="top">
        <img class="appic" src="assets/app-icon.png" alt="주주PASS">
        <h2>의결권 위임 플랫폼</h2>
        <div class="sub">현장 파트너용</div>
      </div>
      <button class="btn" id="lgJoin" type="button" data-help="회원가입">회원가입</button>
      <div class="sep"><span>계정이 있으신가요?</span></div>
      <div class="fld"><label for="lgId">아이디</label>
        <input id="lgId" type="text" placeholder="아이디를 입력해주세요" autocomplete="username"></div>
      <div class="fld"><label for="lgPw">비밀번호</label>
        <div class="pw"><input id="lgPw" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password">
          <button class="eye" id="lgEye" type="button" aria-label="비밀번호 보기"><i class="ph ph-eye-slash"></i></button></div></div>
      <div class="row">
        <button class="sv" id="lgSave" type="button"><span class="cb" id="lgSaveCb"></span>아이디 저장</button>
        <span class="lk"><button type="button" data-help="아이디찾기">아이디찾기</button><span class="sp">|</span><button type="button" data-help="비밀번호 변경">비밀번호 변경</button></span>
      </div>
      <button class="btn" id="lgGo" type="button" disabled>로그인</button>
      <div class="hint">시연용입니다 — 아이디 <b>partner</b> / 비밀번호 <b>1234</b> 로 들어오거나, 아무 값이나 넣어도 로그인됩니다.</div>
    </div>
  </section>

  <!-- ══ 수집 — 주주 목록 · 지도 ══ -->
  <section class="scr" id="scrList">
    <div class="tb">
      <h1>주주 목록</h1>
      <span class="sp"></span>
      <button class="ic" id="btnBook" type="button" aria-label="관심 주주"><i class="ph ph-bookmark-simple"></i></button>
      <button class="ic" id="btnMap" type="button" aria-label="지도 보기"><i class="ph ph-map-trifold"></i></button>
    </div>
    <div class="fbar">
      <div class="chips" id="chips"></div>
      <button class="chipsrch" id="chipSearch" type="button" hidden aria-label="검색">
        <i class="ph ph-magnifying-glass"></i></button>
    </div>
    <div class="srch" id="srchWrap">
      <div class="wrap"><i class="ph ph-magnifying-glass"></i>
        <input id="q" type="search" placeholder="이름, 주소, 생년월일 검색" enterkeyhint="search">
        <button class="clr" id="qClr" type="button" hidden aria-label="지우기"><i class="ph-fill ph-x-circle"></i></button></div>
    </div>

    <!-- 목록 모드 -->
    <div class="bd" id="listBd">
      <div class="lsmeta">
        <button class="srt" id="btnSort" type="button"><span>권유일 입력 순</span><i class="ph ph-caret-up-down"></i></button>
        <span><b id="lsCnt">0</b>건</span>
      </div>
      <div class="cards" id="cards"></div>
    </div>

    <!-- 지도 모드 -->
    <div class="mapwrap" id="mapwrap" hidden>
      <div id="map"></div>
      <div class="mapctl">
        <button id="mapMe" type="button" aria-label="내 위치"><i class="ph ph-crosshair"></i></button>
        <div class="zm">
          <button id="mapIn" type="button" aria-label="확대"><i class="ph ph-plus"></i></button>
          <button id="mapOut" type="button" aria-label="축소"><i class="ph ph-minus"></i></button>
        </div>
      </div>
      <div class="mapnear"><button class="fbtn" id="mapNear" type="button">추천 주주 보기</button></div>
      <div class="hereWrap"><button class="herebtn" id="mapHere" type="button" hidden>
        <i class="ph ph-arrows-clockwise"></i>현재 지도에서 다시 찾기</button></div>

      <div class="sheetup" id="nearSheet">
        <div class="sh-grab" id="nearGrab"><span class="bar"></span></div>
        <div class="sh-h"><b id="nearTt">추천 주주</b>
          <button class="ic" id="nearX" type="button" aria-label="닫기"><i class="ph ph-x"></i></button></div>
        <div class="sh-b"><div class="cards" id="nearCards" style="padding-top:2px"></div></div>
      </div>
    </div>
  </section>

  <!-- ══ 상세 조건 설정 ══ -->
  <section class="scr" id="scrFilter">
    <div class="tb line">
      <button class="ic bk" id="flBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>상세 조건 설정</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain"><div class="acc" id="flAcc"></div></div>
    <div class="dt-ft">
      <button class="btn gh" id="flReset" type="button">초기화</button>
      <button class="btn" id="flApply" type="button">선택 완료</button>
    </div>
  </section>

  <!-- ══ 주주 상세정보 ══ -->
  <section class="scr" id="scrDetail">
    <div class="tb line">
      <button class="ic bk" id="dtBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>주주 상세정보</h1>
      <span class="sp"></span>
      <button class="ic" id="dtHist" type="button" aria-label="히스토리"><i class="ph ph-clock-counter-clockwise"></i></button>
    </div>
    <div class="bd" id="dtBd"></div>
    <div class="dt-ft">
      <button class="btn gh" id="dtState" type="button">방문 상태 변경</button>
      <button class="btn" id="dtStart" type="button">위임 시작</button>
    </div>
  </section>

  <!-- ══ 현관문 사진 촬영 ══ -->
  <section class="scr" id="scrDoor">
    <div class="tb line">
      <button class="ic bk" id="doorBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>현관문 촬영</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain"><div class="pxwrap" id="doorBd"></div></div>
    <div class="dt-ft"><button class="btn" id="doorNext" type="button" disabled>사진 전송</button></div>
  </section>

  <!-- ══ 방문상태 히스토리 ══ -->
  <section class="scr" id="scrHist">
    <div class="tb">
      <button class="ic bk" id="hsBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>방문상태 히스토리</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd"><div class="hslist" id="hsList"></div></div>
  </section>

  <!-- ══ 전체 주소 (대표 주소 설정) ══ -->
  <section class="scr" id="scrAddr">
    <div class="tb">
      <h1>전체 주소</h1>
      <span class="sp"></span>
      <button class="ic" id="adX" type="button" aria-label="닫기"><i class="ph ph-x"></i></button>
    </div>
    <div class="admeta">
      <button class="srt" id="adSort" type="button"><i class="ph ph-funnel-simple"></i><span>거주 가능성 높은 순</span></button>
      <span><b id="adCnt">0</b>건</span>
    </div>
    <div class="bd plain"><div class="adlist" id="adList"></div></div>
    <div class="dt-ft"><button class="btn dark" id="adOk" type="button">대표주소로 변경하기</button></div>
  </section>

  <!-- ══ 연락처 등록 ══ -->
  <section class="scr" id="scrTel">
    <div class="tb">
      <h1>연락처 등록</h1>
      <span class="sp"></span>
      <button class="ic" id="telX" type="button" aria-label="닫기"><i class="ph ph-x"></i></button>
    </div>
    <div class="bd plain telbd">
      <div class="telmid">
        <div class="tellead">주주총회 진행 현황을 알림톡으로 보내드립니다.</div>
        <div class="telfld">
          <input id="telIn" inputmode="none" readonly placeholder="010-0000-0000" maxlength="13">
          <button class="clr" id="telClr" type="button" hidden aria-label="지우기"><i class="ph-fill ph-x-circle"></i></button>
        </div>
        <button class="telagree" id="telAgree" type="button">
          <span class="cb on" id="telCb"></span>
          <span class="t">알림톡 발송 및 안내를 위한 정보 수집 동의</span>
          <span class="more" data-help="정보 수집 동의">자세히 보기</span>
        </button>
      </div>
    </div>
    <button class="telok" id="telOk" type="button" disabled>등록 완료</button>
    <!-- iOS 숫자 키패드 -->
    <div class="kpad" id="kpad">
      <div class="kp"><button type="button" data-k="1"><b>1</b></button>
        <button type="button" data-k="2"><b>2</b><s>ABC</s></button>
        <button type="button" data-k="3"><b>3</b><s>DEF</s></button></div>
      <div class="kp"><button type="button" data-k="4"><b>4</b><s>GHI</s></button>
        <button type="button" data-k="5"><b>5</b><s>JKL</s></button>
        <button type="button" data-k="6"><b>6</b><s>MNO</s></button></div>
      <div class="kp"><button type="button" data-k="7"><b>7</b><s>PQRS</s></button>
        <button type="button" data-k="8"><b>8</b><s>TUV</s></button>
        <button type="button" data-k="9"><b>9</b><s>WXYZ</s></button></div>
      <div class="kp"><span class="gap"></span>
        <button type="button" data-k="0"><b>0</b></button>
        <button type="button" class="bs" data-k="bs" aria-label="지우기"><i class="ph ph-backspace"></i></button></div>
    </div>
  </section>

  <!-- ══ 내 프로필 ══ -->
  <section class="scr" id="scrProfile">
    <div class="tb">
      <button class="ic bk" id="pfBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>내 프로필</h1>
      <span class="sp"></span>
      <button class="ic" id="pfOut" type="button" aria-label="로그아웃"><i class="ph ph-sign-out"></i></button>
    </div>
    <div class="bd" id="pfBd"></div>
  </section>

  <!-- ══ 즐겨찾기 ══ -->
  <section class="scr" id="scrBook">
    <div class="tb">
      <button class="ic bk" id="bkBack2" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>즐겨찾기</h1>
      <span class="sp"></span>
      <button class="ic" id="bkMark" type="button" aria-label="관심 주주"><i class="ph-fill ph-bookmark-simple"></i></button>
      <button class="ic" id="bkMap" type="button" aria-label="지도 보기"><i class="ph ph-map-trifold"></i></button>
    </div>
    <div class="bktabs" id="bkTabs">
      <button type="button" data-bt="save" class="on">저장한 주주</button>
      <button type="button" data-bt="reco">추천 주주</button>
    </div>
    <div class="lsmeta">
      <button class="srt" id="bkSort" type="button"><span>거주 가능성 높은 순</span><i class="ph ph-caret-up-down"></i></button>
      <span><b id="bkCnt">0</b>건</span>
    </div>
    <div class="bd plain"><div class="list" id="bkList"></div></div>
  </section>

  <!-- ══ 정산 내역 ══ -->
  <section class="scr" id="scrSettle">
    <div class="tb">
      <button class="ic bk" id="stlBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>정산 내역</h1>
      <span class="sp"></span>
      <button class="ic" id="stlCfg" type="button" aria-label="정산금 지급 정보"><i class="ph ph-gear-six"></i></button>
    </div>
    <div class="bd plain" id="stlBd"></div>
  </section>

  <!-- ══ 정산금 지급 정보 ══ -->
  <section class="scr" id="scrPay">
    <div class="tb">
      <button class="ic bk" id="payBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>정산금 지급 정보</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain" id="payBd"></div>
  </section>

  <!-- ══ 계좌정보 수정 ══ -->
  <section class="scr" id="scrBank">
    <div class="tb">
      <button class="ic bk" id="bkBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>계좌정보 수정</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain" id="bkBd"></div>
    <div class="dt-ft"><button class="btn" id="bkOk" type="button" disabled>변경하기</button></div>
  </section>

  <!-- ══ 알림 설정 ══ -->
  <section class="scr" id="scrNoti">
    <div class="tb">
      <button class="ic bk" id="ntBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>알림 설정</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain" id="ntBd"></div>
  </section>

  <!-- ══ 공지사항 ══ -->
  <section class="scr" id="scrNotice">
    <div class="tb">
      <button class="ic bk" id="ncBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>공지사항</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain" id="ncBd"></div>
  </section>

  <!-- ══ 자주 묻는 질문 ══ -->
  <section class="scr" id="scrFaq">
    <div class="tb">
      <button class="ic bk" id="fqBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1>자주 묻는 질문</h1>
      <span class="sp"></span>
      <span class="ic" aria-hidden="true"></span>
    </div>
    <div class="bd plain" id="fqBd"></div>
  </section>

  <!-- ══ 위임 진행 (약관 → 행사방향 → 서명 → 신분증) ══ -->
  <section class="scr" id="scrPx">
    <div class="tb line">
      <button class="ic bk" id="pxBack" type="button" aria-label="뒤로"><i class="ph ph-arrow-left"></i></button>
      <h1 id="pxTitle">위임장 작성</h1>
      <span class="sp"></span>
      <button class="ic" id="pxX" type="button" aria-label="닫기"><i class="ph ph-x"></i></button>
    </div>
    <div class="pxsteps"><span class="b on"></span><span class="b"></span><span class="b"></span><span class="b"></span></div>
    <div class="bd plain" id="pxBd"></div>
    <div class="dt-ft"><button class="btn gh" id="pxAlt" type="button" hidden>기타서류로 인증</button><button class="btn" id="pxNext" type="button" disabled>다음</button></div>
  </section>

  <!-- ══ 수집현황 ══ -->
  <section class="scr" id="scrStat">
    <div class="tb"><h1>수집현황</h1></div>
    <div class="bd"><div class="pad" id="statBd"></div></div>
  </section>

  <!-- ══ 소식 ══ -->
  <section class="scr" id="scrNews">
    <div class="tb"><h1>소식</h1></div>
    <div class="segs" id="newsSeg">
      <button class="on" data-seg="noti" type="button">알림</button>
      <button data-seg="promo" type="button">프로모션</button>
    </div>
    <div class="bd plain"><div class="news" id="newsBd"></div></div>
  </section>

  <!-- ══ 설정 ══ -->
  <section class="scr" id="scrSet">
    <div class="tb"><h1>설정</h1></div>
    <div class="bd" id="setBd"></div>
  </section>

  <!-- 하단 탭바 -->
